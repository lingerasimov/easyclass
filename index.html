}

// ---- TRANSLATION ENGINE ----
async function autoTranslate(text, targetLang) {
  if (!text) return text;
  const apiKey = ""; // Runtime key
  const targetName = targetLang === 'ru' ? 'Russian' : 'Hebrew';
  const systemPrompt = `Translate the user content to ${targetName}. If the content is already in that language, keep it exactly as is. Return ONLY the translated text without any explanations.`;
  
  const callApi = async (delay = 1000, attempt = 0) => {
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: text }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        })
      });
      const result = await response.json();
      return result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || text;
    } catch (error) {
      if (attempt < 5) {
        await new Promise(r => setTimeout(r, delay));
        return callApi(delay * 2, attempt + 1);
      }
      return text;
    }
  };

  return await callApi();
}

// ---- FIREBASE HOOKS ----
function useFireCollection(name) {
  const [docs, setDocs] = useState([]);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    function subscribe() {
      if (!window._dbReady || !window.db) { setReady(true); return; }
      try {
        return window.db.collection(name).orderBy('_ts', 'asc').onSnapshot(
          snap => { setDocs(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setReady(true); },
          ()  => { setReady(true); }
        );
      } catch(e) { setReady(true); }
    }
    if (window._dbReady) return subscribe();
    const handler = () => subscribe();
    document.addEventListener('firebase-ready', handler, { once: true });
    return () => document.removeEventListener('firebase-ready', handler);
  }, [name]);
  
  const add = (i) => window.db.collection(name).add({ ...i, _ts: Date.now() });
  const del = (id) => window.db.collection(name).doc(id).delete();
  const upd = (id, i) => window.db.collection(name).doc(id).set({ ...i, _ts: Date.now() });
  return [docs, add, del, upd, ready];
}

function useFireDoc(path, def) {
  const [data, setData] = useState(def);
  useEffect(() => {
    function subscribe() {
      if (!window._dbReady || !window.db) return;
      try {
        return window.db.doc(path).onSnapshot(s => s.exists && setData(s.data()));
      } catch(e) {}
    }
    if (window._dbReady) return subscribe();
    document.addEventListener('firebase-ready', subscribe, { once: true });
  }, [path]);
  const merge = (u) => window.db.doc(path).set(u, { merge: true });
  return [data, merge];
}

                        <div key={key} className="schedule-cell">
                          {editMode ? 
                            <input defaultValue={val} onBlur={e=>mergeSchedule({[key]:e.target.value})} style={{width:'100%',border:'none',textAlign:'center',fontSize:9}}/> :
                            <span style={{fontSize:9}}>{val}</span>
                          }
                        </div>
                      )
                    })}
                  </React.Fragment>
                ))}
              </div>
            </div>
          </div>
        )}
        
        {view === 'social' && (
          <div className="fade-in">
            <div style={{fontWeight:900,fontSize:18,marginBottom:16,display:'flex',justifyContent:'space-between'}}>
              <span>🎉 {t.eventsTitle}</span>
              {editMode && <button onClick={()=>setShowAddEvent(true)} style={{background:'var(--indigo)',border:'none',borderRadius:'50%',width:28,height:28,color:'white'}}>+</button>}
            </div>
            {events.map(ev => (
              <div key={ev.id} className="exam-card">
                <div className="date-box"><div className="day">{new Date(ev.date).getDate()}</div></div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800}}>{ev[`title_${lang}`] || ev.title}</div>
                  <div style={{fontSize:12,color:'#64748b'}}>{ev[`desc_${lang}`] || ev.desc}</div>
                </div>
                <div style={{display:'flex', gap:6, alignItems:'center'}}>
                  {ev.link && <a href={ev.link} target="_blank" className="link-btn" title={t.openLink}><Icon name="link" size={14} /></a>}
                  {editMode && <button onClick={()=>delEvent(ev.id)} style={{background:'none',border:'none'}}>🗑️</button>}
                </div>
              </div>
            ))}
          </div>
        )}

        {view === 'contacts' && (
          <div className="fade-in">
            <div className="card" style={{padding:16, marginBottom:16, background:'var(--indigo-light)'}}>
              <div style={{fontSize:10,fontWeight:800,color:'var(--indigo)'}}>{t.homeroomLabel}</div>
              <div style={{fontWeight:900,fontSize:18}}>לילי / Лили</div>
              <a href={`tel:${meta.homeroomPhone}`} style={{color:'var(--indigo)',fontWeight:700,fontSize:14}}>📞 {meta.homeroomPhone}</a>
            </div>
            <div style={{display:'flex', gap:8, marginBottom:16}}>
              <input className="input-field" placeholder={t.searchStudent} value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1}}/>
              <button onClick={()=>setShowAddContact(true)} style={{background:'var(--indigo)',color:'white',border:'none',borderRadius:12,padding:'0 14px',fontWeight:700}}>+</button>
            </div>
            <div className="card">
              {contacts.filter(c => c.studentName.includes(search)).map(c => (
                <div key={c.id} className="contact-row" style={{padding:'10px 16px'}}>
                  <div className="contact-avatar">{c.studentName[0]}</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:800}}>{c.studentName}</div>
                    <div style={{fontSize:11,color:'#64748b'}}>{c.parent1Name} {c.parent1Phone}</div>
                  </div>
                  {editMode && <button onClick={()=>delContact(c.id)} style={{border:'none',background:'none'}}>🗑️</button>}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* TABS */}
      <div className="tab-bar">
        <div className="tab-bar-inner">
          <button onClick={()=>setView('home')} className={`tab-btn ${view==='home'?'active':''}`}><Icon name="home"/><span className="label">{t.homeTab}</span></button>
          <button onClick={()=>setView('schedule')} className={`tab-btn ${view==='schedule'?'active':''}`}><Icon name="grid"/><span className="label">{t.scheduleTab}</span></button>
          <button onClick={()=>setView('social')} className={`tab-btn ${view==='social'?'active':''}`}><Icon name="social"/><span className="label">{t.socialTab}</span></button>
          <button onClick={()=>setView('contacts')} className={`tab-btn ${view==='contacts'?'active':''}`}><Icon name="users"/><span className="label">{t.contactsTab}</span></button>
        </div>
      </div>

      {/* A11Y MODAL */}
      {showA11y && (
        <div className="modal-overlay" onClick={()=>setShowA11y(false)}>
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div className="modal-handle"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div style={{fontWeight:900,fontSize:18}}>{t.a11yTitle}</div>
              <div style={{display:'flex',gap:8}}>
                <button onClick={()=>setLang('he')} style={{fontWeight:lang==='he'?900:400,color:lang==='he'?'var(--indigo)':'#94a3b8',border:'none',background:'none'}}>HE</button>
                <button onClick={()=>setLang('ru')} style={{fontWeight:lang==='ru'?900:400,color:lang==='ru'?'var(--indigo)':'#94a3b8',border:'none',background:'none'}}>RU</button>
              </div>
            </div>
            <div className="a11y-grid">
              <button className={`a11y-option ${a11y.highContrast?'active':''}`} onClick={()=>setA11y(p=>({...p,highContrast:!p.highContrast}))}>🌓 {t.a11yContrast}</button>
              <button className={`a11y-option ${a11y.grayscale?'active':''}`} onClick={()=>setA11y(p=>({...p,grayscale:!p.grayscale}))}>🏁 {t.a11yGrayscale}</button>
              <button className={`a11y-option ${a11y.readableFont?'active':''}`} onClick={()=>setA11y(p=>({...p,readableFont:!p.readableFont}))}>🔤 {t.a11yFont}</button>
              <button className={`a11y-option ${a11y.highlightLinks?'active':''}`} onClick={()=>setA11y(p=>({...p,highlightLinks:!p.highlightLinks}))}>🔗 {t.a11yLinks}</button>
            </div>
            <button className="btn-primary" onClick={()=>setShowA11y(false)} style={{marginTop:20}}>{t.close}</button>
          </div>
        </div>
      )}

      {/* MODALS */}
      {showAddNotice && <div className="modal-overlay" onClick={()=>setShowAddNotice(false)}><div className="modal-sheet" onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:900,marginBottom:15}}>{t.addNotice}</div>
          <textarea className="input-field" id="nText" rows="4" placeholder={t.addNotice}></textarea>
          <button className="btn-primary" style={{marginTop:10}} onClick={()=>{handleAddNotice(document.getElementById('nText').value)}} disabled={isTranslating}>
            {isTranslating ? t.translating : t.add}
          </button>
      </div></div>}
      
      {(showAddExam || editingExam) && <div className="modal-overlay" onClick={()=>{setShowAddExam(false); setEditingExam(null)}}><div className="modal-sheet" onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:900,marginBottom:15}}>{editingExam ? t.editExam : t.addExam}</div>
          <select className="input-field" id="eSub" defaultValue={editingExam?.subject || ''}>
            {TRANSLATIONS.he.subjectsList.map((s,i)=><option key={s} value={s}>{t.subjectsList[i]}</option>)}
          </select>
          <input type="date" className="input-field" id="eDate" style={{marginTop:10}} defaultValue={editingExam?.date || ''}/>
          <input className="input-field" id="eDet" placeholder="Details" style={{marginTop:10}} defaultValue={editingExam ? (editingExam[`details_${lang}`] || editingExam.details) : ''}/>
          <input className="input-field" id="eLink" placeholder={t.linkPlaceholder} style={{marginTop:10}} defaultValue={editingExam?.link || ''}/>
          <button className="btn-primary" style={{marginTop:10}} onClick={()=>{handleSaveExam({subject:document.getElementById('eSub').value,date:document.getElementById('eDate').value,details:document.getElementById('eDet').value,link:document.getElementById('eLink').value,type:'exam'})}} disabled={isTranslating}>
            {isTranslating ? t.translating : (editingExam ? t.save : t.add)}
          </button>
      </div></div>}

      {showAddEvent && <div className="modal-overlay" onClick={()=>setShowAddEvent(false)}><div className="modal-sheet" onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:900,marginBottom:15}}>{t.socialTab}</div>
          <input className="input-field" id="evTitle" placeholder="Title" />
          <input type="date" className="input-field" id="evDate" style={{marginTop:10}}/>
          <textarea className="input-field" id="evDesc" rows="3" style={{marginTop:10}} placeholder="Description"></textarea>
          <input className="input-field" id="evLink" placeholder={t.linkPlaceholder} style={{marginTop:10}} />
          <button className="btn-primary" style={{marginTop:10}} onClick={()=>{handleAddEvent({title:document.getElementById('evTitle').value,date:document.getElementById('evDate').value,desc:document.getElementById('evDesc').value,link:document.getElementById('evLink').value})}} disabled={isTranslating}>
            {isTranslating ? t.translating : t.add}
          </button>
      </div></div>}

      {showAddContact && <div className="modal-overlay" onClick={()=>setShowAddContact(false)}><div className="modal-sheet" onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:900,marginBottom:15}}>{t.addContact}</div>
          <input className="input-field" id="cName" placeholder={t.firstName} />
          <input className="input-field" id="cPName" placeholder={t.parent} style={{marginTop:10}}/>
          <input className="input-field" id="cPhone" placeholder={t.phone} style={{marginTop:10}}/>
          <button className="btn-primary" style={{marginTop:10}} onClick={()=>{
              const name = document.getElementById('cName').value;
              const pName = document.getElementById('cPName').value;
              const phone = document.getElementById('cPhone').value;
              if (name && pName && phone) {
                window.db.collection('contacts').add({ studentName: name, parent1Name: pName, parent1Phone: phone, _ts: Date.now() });
                setShowAddContact(false);
              }
            }}>{t.add}</button>
      </div></div>}
    </div>
  );
}

function AuthScreen({ t, lang, setLang, onLogin }) {
  const [step, setStep] = useState('code');
  const [code, setCode] = useState('');
  const [role, setRole] = useState('');
  const [f, setF] = useState({firstName:'',lastName:'',phone:''});

  const handleSubmit = async () => {
    // Persistent back-door: works everywhere, even after publication
    if (f.phone === '123123') {
      onLogin({ 
        id: 'dummy-tester-id-' + Date.now(),
        firstName: 'Tester', 
        lastName: 'Mode', 
        phone: '123123', 
        role: 'admin', 
        isDummy: true 
      });
      return;
    }
    
    if (role && f.firstName && f.lastName && f.phone) {
      onLogin({...f, role});
    }
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#EEF2FF 0%,#CCFBF1 100%)',padding:20}}>
      <div style={{position:'absolute',top:20,right:20,display:'flex',gap:10}}>
         <button onClick={()=>setLang('he')} style={{fontWeight:lang==='he'?900:400,border:'none',background:'none',fontSize:12}}>HE</button>
         <button onClick={()=>setLang('ru')} style={{fontWeight:lang==='ru'?900:400,border:'none',background:'none',fontSize:12}}>RU</button>
      </div>
      <div style={{background:'white',borderRadius:28,padding:28,width:'100%',maxWidth:420,boxShadow:'0 20px 60px rgba(0,0,0,0.1)'}}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:48}}>📚</div>
          <div style={{fontWeight:900,fontSize:24,color:'var(--indigo)'}}>{t.appName}</div>
        </div>
        {step === 'code' ? (
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div style={{fontSize:14,fontWeight:700,textAlign:'center'}}>{t.classCodeLabel}</div>
            <input className="input-field" type="password" value={code} onChange={e=>setCode(e.target.value)} style={{textAlign:'center',fontSize:24,letterSpacing:8}}/>
            <button className="btn-primary" onClick={()=>code==='1111'?setStep('details'):alert(t.classCodeWrong)}>{t.continue}</button>
          </div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{display:'flex',gap:8}}>
              <input className="input-field" placeholder={t.firstName} value={f.firstName} onChange={e=>setF({...f,firstName:e.target.value})} disabled={f.phone==='123123'}/>
              <input className="input-field" placeholder={t.lastName} value={f.lastName} onChange={e=>setF({...f,lastName:e.target.value})} disabled={f.phone==='123123'}/>
            </div>
            <input className="input-field" placeholder={t.phone} value={f.phone} onChange={e=>setF({...f,phone:e.target.value})}/>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button onClick={()=>setRole('parent')} disabled={f.phone==='123123'} style={{flex:1,padding:10,borderRadius:12,border:role==='parent'?'2px solid var(--indigo)':'1px solid #ddd',background:role==='parent'?'var(--indigo-light)':'white'}}>{t.parent}</button>
              <button onClick={()=>setRole('student')} disabled={f.phone==='123123'} style={{flex:1,padding:10,borderRadius:12,border:role==='student'?'2px solid var(--indigo)':'1px solid #ddd',background:role==='student'?'var(--indigo-light)':'white'}}>{t.student}</button>
            </div>
            <button className="btn-primary" onClick={handleSubmit} disabled={f.phone !== '123123' && (!role || !f.firstName || !f.lastName || !f.phone)}>{t.enterApp}</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
