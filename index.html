// ---- FIREBASE HOOKS ----
function getDb() {
  if (!window.db) throw new Error("Firestore not ready");
  return window.db;
}

function cleanItem(item) {
  const clean = { ...item, _ts: Date.now() };
  if (clean.attachments) {
    clean.attachments = clean.attachments.map(a =>
      (a.type === 'image' || a.type === 'file') && a.data
        ? { type: a.type, name: a.name, _local: true }
        : a
    );
  }
  return clean;
}

function useFireCollection(name) {
  const [docs, setDocs] = useState([]);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    function subscribe() {
      if (!window._dbReady || !window.db) { setReady(true); return; }
      let unsub;
      try {
        unsub = getDb().collection(name)
          .orderBy('_ts', 'asc')
          .onSnapshot(
            snap => { setDocs(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setReady(true); },
            err  => { console.warn('Firestore listen error:', err); setReady(true); }
          );
      } catch(e) { console.error(e); setReady(true); }
      return unsub;
    }

    // If Firebase already ready, subscribe immediately
    if (window._dbReady) {
      const unsub = subscribe();
      return () => unsub && unsub();
    }
    // Otherwise wait for firebase-ready event
    let unsub;
    const handler = () => { unsub = subscribe(); };
    document.addEventListener('firebase-ready', handler, { once: true });
    return () => {
      document.removeEventListener('firebase-ready', handler);
      unsub && unsub();
    };
  }, [name]);

  const add = (item) => { try { return getDb().collection(name).add(cleanItem(item)); } catch(e) { console.error(e); } };
  const del = (id)   => { try { return getDb().collection(name).doc(id).delete(); } catch(e) { console.error(e); } };
  const upd = (id, item) => { try { return getDb().collection(name).doc(id).set(cleanItem(item)); } catch(e) { console.error(e); } };

  return [docs, add, del, upd, ready];
}

function useFireDoc(path, def) {
  const [data, setData] = useState(def);
  useEffect(() => {
    function subscribe() {
      if (!window._dbReady || !window.db) return null;
      try {
        return getDb().doc(path).onSnapshot(
          snap => { if (snap.exists) setData(snap.data()); },
          err  => console.warn('Firestore doc error:', err)
        );
      } catch(e) { console.error(e); return null; }
    }
    if (window._dbReady) {
      const unsub = subscribe();
      return () => unsub && unsub();
    }
    let unsub;
    const handler = () => { unsub = subscribe(); };
    document.addEventListener('firebase-ready', handler, { once: true });
    return () => {
      document.removeEventListener('firebase-ready', handler);
      unsub && unsub();
    };
  }, [path]);
  const merge = (updates) => { try { getDb().doc(path).set(updates, { merge: true }); } catch(e) { console.error(e); } };
  return [data, merge];
}

// ---- INSTALL BANNER ----
function InstallBanner() {
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [show, setShow] = useState(false);
  const [isIOS, setIsIOS] = useState(false);
  const [dismissed, setDismissed] = useState(() => localStorage.getItem('ec_install_dismissed') === '1');

  useEffect(() => {
    const ua = navigator.userAgent;
    const ios = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    if (ios && !standalone && !dismissed) { setIsIOS(true); setShow(true); }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); setDeferredPrompt(e);
      if (!dismissed) setShow(true);
    });
  }, []);

  if (!show || dismissed) return null;

  const install = async () => {
    if (deferredPrompt) { deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; if (r.outcome === 'accepted') setShow(false); }
    else setShow(false);
  };
  const dismiss = () => { setShow(false); localStorage.setItem('ec_install_dismissed','1'); setDismissed(true); };

  return (
    <div id="install-banner" className="zoom-in">
      <div style={{fontSize:32}}>📲</div>
      <div style={{flex:1}}>
        <div style={{fontWeight:800,fontSize:14,color:'#1e293b'}}>התקיני את Easy Class</div>
        <div style={{fontSize:11,color:'#64748b',marginTop:2}}>
          {isIOS ? 'לחצי על 🔗 Share ואז "הוסף למסך הבית"' : 'הוסיפי לאייקונים בלחיצה אחת'}
        </div>
      </div>
      {!isIOS && <button onClick={install} style={{background:'var(--indigo)',color:'white',border:'none',borderRadius:12,padding:'8px 14px',fontSize:12,fontWeight:700}}>התקן</button>}
      <button onClick={dismiss} style={{background:'none',border:'none',color:'#94a3b8',padding:4}}><Icon name="x" size={18}/></button>
    </div>
  );
}


// ---- LOAD CHECKER (חוזר מנכ"ל) ----
function checkAcademicLoad(exams) {
  const today = new Date(); today.setHours(0,0,0,0);
  const assessmentTypes = ['exam','quiz','project','hw','task'];

  // Get assessments in the next 14 days
  const upcoming = exams.filter(e => {
    const d = new Date(e.date); d.setHours(0,0,0,0);
    const diff = Math.ceil((d - today) / 86400000);
    return diff >= 0 && diff <= 14;
  });

  const violations = [];
  const warnings = [];

  // Group by date
  const byDate = {};
  upcoming.forEach(e => {
    const key = e.date;
    if (!byDate[key]) byDate[key] = [];
    byDate[key].push(e);
  });

  // Check: more than 1 assessment per day
  Object.entries(byDate).forEach(([date, items]) => {
    if (items.length > 1) {
      const d = new Date(date);
      const dayStr = d.toLocaleDateString('he-IL', {weekday:'long', day:'numeric', month:'long'});
      violations.push(`יותר מאירוע הערכה אחד ב${dayStr} (${items.length} אירועים: ${items.map(i=>i.subject).join(', ')})`);
    }
  });

  // Group by week (Sun-Sat)
  const byWeek = {};
  upcoming.forEach(e => {
    const d = new Date(e.date);
    const day = d.getDay();
    const sunday = new Date(d);
    sunday.setDate(d.getDate() - day);
    sunday.setHours(0,0,0,0);
    const key = sunday.toISOString().slice(0,10);
    if (!byWeek[key]) byWeek[key] = [];
    byWeek[key].push(e);
  });

  // Check: more than 3 assessments per week
  Object.entries(byWeek).forEach(([weekStart, items]) => {
    if (items.length > 3) {
      const d = new Date(weekStart);
      const weekStr = d.toLocaleDateString('he-IL', {day:'numeric', month:'long'});
      violations.push(`יותר מ-3 אירועי הערכה בשבוע ${weekStr} (${items.length} אירועים)`);
    } else if (items.length === 3) {
      const d = new Date(weekStart);
      const weekStr = d.toLocaleDateString('he-IL', {day:'numeric', month:'long'});
      warnings.push(`3 אירועי הערכה בשבוע ${weekStr} — מקסימום מותר`);
    }
  });

  // Check: more than 2 exams per subject (in next 60 days = rough semester)
  const examsBySubject = {};
  exams.filter(e => {
    const d = new Date(e.date); d.setHours(0,0,0,0);
    const diff = Math.ceil((d - today) / 86400000);
    return diff >= 0 && diff <= 90 && e.type === 'exam';
  }).forEach(e => {
    if (!examsBySubject[e.subject]) examsBySubject[e.subject] = 0;
    examsBySubject[e.subject]++;
  });
  Object.entries(examsBySubject).forEach(([subject, count]) => {
    if (count > 2) {
      violations.push(`${subject}: ${count} מבחנים במחצית (מותר עד 2)`);
    }
  });

  return { violations, warnings, ok: violations.length === 0 && warnings.length === 0 };
}

function LoadBanner({ exams }) {
  const [open, setOpen] = useState(false);
  const { violations, warnings, ok } = useMemo(() => checkAcademicLoad(exams), [exams]);

  if (ok) {
    return (
      <div style={{
        display:'flex', alignItems:'center', gap:10,
        background:'#f0fdf4', border:'1.5px solid #86efac',

              <span>⚠️</span><span>{v}</span>
            </div>
          ))}
          {warnings.map((w,i) => (
            <div key={i} style={{display:'flex', gap:6, alignItems:'flex-start', marginBottom:6, fontSize:12, color:'#92400e', fontWeight:600}}>
              <span>⚡</span><span>{w}</span>
            </div>
          ))}
          <div style={{fontSize:10, color:'#94a3b8', marginTop:6, borderTop:'1px solid #f1f5f9', paddingTop:6}}>
            לפי חוזר מנכ"ל: מקס' 1 אירוע ביום · 3 בשבוע · 2 מבחנים למקצוע במחצית
          </div>
        </div>
      )}

  );
}

  );

function AttachmentPicker({ attachments, onChange }) {
  const fileRef = React.useRef(null);
  const [linkInput, setLinkInput] = useState('');
  const [linkMode, setLinkMode] = useState(null);

  const addLink = () => {
    if (!linkInput.trim()) return;
    const isGdrive = linkInput.includes('drive.google.com') || linkInput.includes('docs.google.com') || linkInput.includes('sheets.google.com');
    onChange([...attachments, { type: isGdrive ? 'gdrive' : 'url', url: linkInput.trim(), name: linkInput.trim().slice(0,50) }]);
    setLinkInput(''); setLinkMode(null);
  };

  const addFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert('הקובץ גדול מדי (מקס 2MB). השתמשי בקישור Google Drive.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      onChange([...attachments, { type: file.type.startsWith('image/') ? 'image' : 'file', data: ev.target.result, name: file.name }]);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  const remove = (i) => onChange(attachments.filter((_,idx) => idx !== i));
  const iconFor = (att) => att.type === 'image' ? '🖼️' : att.type === 'gdrive' ? '📂' : att.type === 'file' ? '📄' : '🔗';

  return (
    <div>
      <label style={{fontSize:12,fontWeight:700,color:'#64748b',marginBottom:8,display:'block'}}>📎 צרפי קובץ / קישור (אופציונלי)</label>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
        <button type="button" onClick={() => fileRef.current.click()}
          style={{display:'flex',alignItems:'center',gap:5,padding:'8px 12px',borderRadius:12,border:'1.5px dashed #c7d2fe',background:'#eef2ff',color:'var(--indigo)',fontWeight:700,fontSize:12,cursor:'pointer'}}>
          🖼️ תמונה / קובץ
        </button>
        <button type="button" onClick={() => setLinkMode(linkMode === 'url' ? null : 'url')}
          style={{display:'flex',alignItems:'center',gap:5,padding:'8px 12px',borderRadius:12,border:'1.5px dashed',borderColor: linkMode==='url' ? 'var(--indigo)' : '#c7d2fe',background: linkMode==='url' ? 'var(--indigo-light)' : 'white',color:'var(--indigo)',fontWeight:700,fontSize:12,cursor:'pointer'}}>
          🔗 קישור
        </button>
        <button type="button" onClick={() => setLinkMode(linkMode === 'gdrive' ? null : 'gdrive')}
          style={{display:'flex',alignItems:'center',gap:5,padding:'8px 12px',borderRadius:12,border:'1.5px dashed',borderColor: linkMode==='gdrive' ? '#16a34a' : '#86efac',background: linkMode==='gdrive' ? '#f0fdf4' : 'white',color:'#16a34a',fontWeight:700,fontSize:12,cursor:'pointer'}}>
          📂 Google Drive
        </button>
        <input ref={fileRef} type="file" accept="image/*,.pdf,.doc,.docx,.ppt,.pptx" style={{display:'none'}} onChange={addFile}/>
      </div>
      {linkMode && (
        <div style={{display:'flex',gap:6,marginBottom:8}}>
          <input className="input-field" style={{flex:1,fontSize:12}}
            placeholder={linkMode === 'gdrive' ? 'הדביקי קישור Google Drive / Docs...' : 'הדביקי קישור...'}
            value={linkInput} onChange={e => setLinkInput(e.target.value)}
            onKeyDown={e => { if(e.key==='Enter'){ e.preventDefault(); addLink(); }}}/>
          <button type="button" onClick={addLink}
            style={{background:'var(--indigo)',color:'white',border:'none',borderRadius:12,padding:'0 14px',fontWeight:700,fontSize:13,cursor:'pointer'}}>הוסף</button>
        </div>
      )}
      {attachments.length > 0 && (
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {attachments.map((att,i) => (
            <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:'#f8fafc',borderRadius:10,padding:'7px 10px',border:'1px solid #e2e8f0'}}>
              <span>{iconFor(att)}</span>
              {att.type === 'image' && <img src={att.data} style={{width:32,height:32,objectFit:'cover',borderRadius:6,border:'1px solid #e2e8f0'}}/>}
              <span style={{flex:1,fontSize:11,fontWeight:600,color:'#374151',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{att.name}</span>
              <button type="button" onClick={() => remove(i)} style={{background:'none',border:'none',color:'#f87171',padding:2,cursor:'pointer',fontSize:14}}>✕</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AddExamForm({ subjects, onSubmit, onCancel, defaultSubject, initialData, submitLabel }) {
  const ALL_SUBJECTS = [...subjects, 'אחר'];
  const isKnownSubject = (s) => subjects.includes(s);

  const [sub, setSub] = useState(() => {
    if (initialData) return isKnownSubject(initialData.subject) ? initialData.subject : 'אחר';
    return defaultSubject || subjects[0];
  });
  const [customSub, setCustomSub] = useState(() => {
    if (initialData && !isKnownSubject(initialData.subject)) return initialData.subject;
    return '';
  });
  const [type, setType] = useState(initialData?.type || 'exam');
  const [date, setDate] = useState(initialData?.date || '');
  const [details, setDetails] = useState(initialData?.details || '');
  const [time, setTime] = useState(initialData?.time || '');
  const [attachments, setAttachments] = useState(initialData?.attachments || []);
  const [dateError, setDateError] = useState(false);
  const [added, setAdded] = useState(false);

  const finalSubject = sub === 'אחר' ? (customSub.trim() || 'אחר') : sub;

  const handleSubmit = () => {
    if (!date) { setDateError(true); return; }
    setDateError(false);
    const item = { subject: finalSubject, type, date, time, details, attachments };
    setAdded(true);
    setTimeout(() => {
      onSubmit(item);
    }, 350);
  };

  const types = [{k:'exam',v:'מבחן'},{k:'project',v:'עבודה'},{k:'quiz',v:'בוחן'},{k:'hw',v:'שיעורי בית'},{k:'task',v:'משימה'}];
  const typeEmoji = {exam:'📝',project:'📚',quiz:'✏️',hw:'🏠',task:'✅'};

  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      {/* Subject */}
      <div>
        <label style={{fontSize:12,fontWeight:700,color:'#64748b',marginBottom:4,display:'block'}}>מקצוע</label>
        <select className="input-field" value={sub} onChange={e=>{setSub(e.target.value);}}>
          {ALL_SUBJECTS.map(s=><option key={s} value={s}>{s === 'אחר' ? '✏️ אחר — הזיני שם' : s}</option>)}
        </select>
        {sub === 'אחר' && (
          <input className="input-field" style={{marginTop:6}}
            placeholder="שם המקצוע / הנושא (למשל: למידה מרחוק...)"
            value={customSub} onChange={e=>setCustomSub(e.target.value)} autoFocus/>
        )}
      </div>

      {/* Type */}
      <div>
        <label style={{fontSize:12,fontWeight:700,color:'#64748b',marginBottom:6,display:'block'}}>סוג</label>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {types.map(t=>(
            <button key={t.k} type="button" onClick={()=>setType(t.k)}
              style={{flex:'1 1 28%',padding:'9px 6px',borderRadius:12,border:'1.5px solid',fontWeight:700,fontSize:12,cursor:'pointer',transition:'all 0.15s',
                borderColor: type===t.k ? 'var(--indigo)' : '#e2e8f0',
                background: type===t.k ? 'var(--indigo)' : 'white',
                color: type===t.k ? 'white' : '#64748b'}}>
              {typeEmoji[t.k]} {t.v}
            </button>
          ))}
        </div>
      </div>

      {/* Date + Time */}
      <div>
        <label style={{fontSize:12,fontWeight:700,color: dateError ? 'var(--rose)' : '#64748b',marginBottom:4,display:'block'}}>
          {dateError ? '⚠️ חובה לבחור תאריך' : 'תאריך *'}
        </label>
        <div style={{display:'flex',gap:8}}>
          <input type="date" className="input-field" value={date}
            onChange={e=>{setDate(e.target.value); setDateError(false);}}
            style={{flex:2, borderColor: dateError ? 'var(--rose)' : undefined}}/>
          <div style={{flex:1,position:'relative'}}>
            <input type="time" className="input-field" value={time}
              onChange={e=>setTime(e.target.value)}
              placeholder="שעה"
              style={{width:'100%'}}/>
          </div>
        </div>
        {time && <div style={{fontSize:11,color:'var(--teal)',fontWeight:700,marginTop:4}}>⏰ שעה: {time}</div>}
      </div>

      {/* Details */}
      <div>
        <label style={{fontSize:12,fontWeight:700,color:'#64748b',marginBottom:4,display:'block'}}>נושאים / פרטים</label>
        <input className="input-field" placeholder="למשל: פרקים 3-5, מהעמוד 40..."
          value={details} onChange={e=>setDetails(e.target.value)}/>
      </div>

      {/* Attachments */}
      <AttachmentPicker attachments={attachments} onChange={setAttachments}/>

      {/* Submit */}
      <button type="button" onClick={handleSubmit}
        style={{
          background: added ? '#22c55e' : (submitLabel ? 'var(--teal)' : 'var(--indigo)'),
          color:'white', border:'none', borderRadius:14, padding:'14px',
          fontWeight:800, fontSize:15, cursor:'pointer',
          transition:'all 0.3s', marginTop:4,
          transform: added ? 'scale(0.97)' : 'scale(1)',
          display:'flex', alignItems:'center', justifyContent:'center', gap:8
        }}>
        {added ? <>{submitLabel ? '✓ נשמר!' : '✓ נוסף!'}</> : <>{submitLabel || 'הוסף ✨'}</>}
      </button>
      <button type="button" onClick={onCancel}
        style={{background:'none',border:'none',color:'#94a3b8',fontWeight:700,padding:'8px',fontSize:14,cursor:'pointer'}}>
        ביטול
      </button>
    </div>
  );
}

function SimpleTextForm({ label, onSubmit, onCancel }) {
  const [text, setText] = useState('');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <textarea className="input-field" rows={4} placeholder={label} value={text} onChange={e=>setText(e.target.value)} style={{resize:'none'}}/>
      <button className="btn-primary" onClick={() => {if(text.trim()) onSubmit(text.trim());}} disabled={!text.trim()}>שמור</button>
      <button onClick={onCancel} style={{background:'none',border:'none',color:'#94a3b8',fontWeight:700,padding:'8px',fontSize:14}}>ביטול</button>
    </div>
  );
}

function AddEventForm({ onSubmit, onCancel }) {
  const [title, setTitle] = useState('');
  const [date, setDate] = useState('');
  const [desc, setDesc] = useState('');
  const [attachments, setAttachments] = useState([]);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <input className="input-field" placeholder="שם האירוע *" value={title} onChange={e=>setTitle(e.target.value)}/>
      <input type="date" className="input-field" value={date} onChange={e=>setDate(e.target.value)}/>
      <textarea className="input-field" rows={3} placeholder="תיאור (אופציונלי)" value={desc} onChange={e=>setDesc(e.target.value)} style={{resize:'none'}}/>
      <AttachmentPicker attachments={attachments} onChange={setAttachments}/>
      <button className="btn-primary" onClick={() => {if(title&&date) onSubmit({title,date,desc,attachments});}} disabled={!title||!date}>הוסף</button>
      <button onClick={onCancel} style={{background:'none',border:'none',color:'#94a3b8',fontWeight:700,padding:'8px',fontSize:14}}>ביטול</button>

}

function AddContactForm({ onSubmit, onCancel }) {
  const [f, setF] = useState({studentName:'', parent1Name:'', parent1Phone:'', parent2Name:'', parent2Phone:'', studentPhone:''});
  const set = (k,v) => setF(p => ({...p,[k]:v}));
  return (
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <input className="input-field" placeholder="שם התלמיד/ה *" value={f.studentName} onChange={e=>set('studentName',e.target.value)}/>
      <div style={{background:'#f0f9ff',borderRadius:16,padding:12,display:'flex',flexDirection:'column',gap:8}}>
        <div style={{fontSize:12,fontWeight:800,color:'var(--indigo)'}}>הורה 1 *</div>
        <input className="input-field" placeholder="שם הורה" value={f.parent1Name} onChange={e=>set('parent1Name',e.target.value)} style={{background:'white'}}/>
        <input className="input-field" placeholder="נייד" value={f.parent1Phone} onChange={e=>set('parent1Phone',e.target.value)} style={{background:'white'}}/>
      </div>
      <div style={{background:'#f8fafc',borderRadius:16,padding:12,display:'flex',flexDirection:'column',gap:8}}>
        <div style={{fontSize:12,fontWeight:800,color:'#64748b'}}>הורה 2 (אופציונלי)</div>
        <input className="input-field" placeholder="שם הורה" value={f.parent2Name} onChange={e=>set('parent2Name',e.target.value)}/>
        <input className="input-field" placeholder="נייד" value={f.parent2Phone} onChange={e=>set('parent2Phone',e.target.value)}/>
      </div>
      <input className="input-field" placeholder="📱 נייד תלמיד (אופציונלי)" value={f.studentPhone} onChange={e=>set('studentPhone',e.target.value)}/>
      <button className="btn-primary" onClick={() => {if(f.studentName&&f.parent1Name) onSubmit(f);}} disabled={!f.studentName||!f.parent1Name}>שמור</button>
      <button onClick={onCancel} style={{background:'none',border:'none',color:'#94a3b8',fontWeight:700,padding:'8px',fontSize:14}}>ביטול</button>
    </div>
  );
}

function AddCommentForm({ subject, onSubmit, onCancel }) {
  const [author, setAuthor] = useState('');
  const [text, setText] = useState('');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <div style={{background:'var(--indigo-light)',borderRadius:12,padding:'8px 14px',fontSize:12,fontWeight:700,color:'var(--indigo)'}}>מקצוע: {subject}</div>
      <input className="input-field" placeholder="שם פרטי + משפחה *" value={author} onChange={e=>setAuthor(e.target.value)}/>
      <textarea className="input-field" rows={4} placeholder="תוכן ההערה *" value={text} onChange={e=>setText(e.target.value)} style={{resize:'none'}}/>
      <button className="btn-primary" onClick={() => {if(author.trim()&&text.trim()) onSubmit({subject,author:author.trim(),text:text.trim()});}} disabled={!author.trim()||!text.trim()}>שלח הערה</button>
      <button onClick={onCancel} style={{background:'none',border:'none',color:'#94a3b8',fontWeight:700,padding:'8px',fontSize:14}}>ביטול</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

<!-- Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'easyclass-v2';
    const ASSETS = ['/'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
    });
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        fetch(e.request).then(r => {
          const clone = r.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
          return r;
        }).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
