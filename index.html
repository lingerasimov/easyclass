function initFirebase() {
  try {
    if (typeof firebase === 'undefined') throw new Error('firebase not loaded');
    if (!firebase.apps.length) firebase.initializeApp(window._firebaseConfig);
    window.db = firebase.firestore();
    window._dbReady = true;

  } catch(e) {
    console.error("❌ Firebase init failed:", e);
    document.dispatchEvent(new Event('firebase-ready'));
  }
}

function loadScript(src, onload, onerror) {
  const s = document.createElement('script');
  s.src = src; s.onload = onload; s.onerror = onerror;
  document.head.appendChild(s);
}

const FIREBASE_VER = '9.23.0';
const CDNS = [
  `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-app-compat.js`,
  `https://cdnjs.cloudflare.com/ajax/libs/firebase/${FIREBASE_VER}/firebase-app-compat.min.js`
];
const CDNS_FS = [
  `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-firestore-compat.js`,
  `https://cdnjs.cloudflare.com/ajax/libs/firebase/${FIREBASE_VER}/firebase-firestore-compat.min.js`
];

function loadApp(idx) {
  if (idx >= CDNS.length) { document.dispatchEvent(new Event('firebase-ready')); return; }
  loadScript(CDNS[idx], () => loadFirestore(0), () => loadApp(idx + 1));
}
function loadFirestore(idx) {
  if (idx >= CDNS_FS.length) { initFirebase(); return; }

// ─── FIREBASE HOOKS ───────────────────────────────────────────────────────────

// FIX #5: Properly return unsubscribe from useEffect + expose Firebase error
function useFireCollection(name) {
  const [docs, setDocs] = useState([]);
  const [ready, setReady] = useState(false);
  const [fbError, setFbError] = useState(false);

  useEffect(() => {
    let unsub = null;

    function subscribe() {
      if (!window._dbReady || !window.db) {
        setReady(true);
        setFbError(true);
        return;
      }
      try {
        unsub = window.db.collection(name).orderBy('_ts', 'asc').onSnapshot(
          snap => {
            setDocs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            setReady(true);
            setFbError(false);
          },
          err => {
            console.error(`Firestore [${name}] error:`, err);
            setReady(true);
            setFbError(true);
          }
        );
      } catch(e) {
        console.error(`Firestore [${name}] init error:`, e);
        setReady(true);
        setFbError(true);
      }
    }

    if (window._dbReady) {
      subscribe();
    } else {
      const handler = () => subscribe();
      document.addEventListener('firebase-ready', handler, { once: true });
      return () => document.removeEventListener('firebase-ready', handler);
    }

    // FIX #5: Proper cleanup
    return () => { if (unsub) unsub(); };
  }, [name]);

  const add = useCallback((item) => {
    if (!window.db) return Promise.reject('No DB');
    return window.db.collection(name).add({ ...item, _ts: Date.now() });
  }, [name]);

  const del = useCallback((id) => {
    if (!window.db) return Promise.reject('No DB');
    return window.db.collection(name).doc(id).delete();
  }, [name]);

  const upd = useCallback((id, item) => {
    if (!window.db) return Promise.reject('No DB');
    return window.db.collection(name).doc(id).set({ ...item, _ts: Date.now() });
  }, [name]);

  return [docs, add, del, upd, ready, fbError];
}

function useFireDoc(path, def) {
  const [data, setData] = useState(def);
  useEffect(() => {
    let unsub = null;
    function subscribe() {
      if (!window._dbReady || !window.db) return;
      try {
        unsub = window.db.doc(path).onSnapshot(
          s => { if (s.exists) setData(s.data()); },
          err => console.error(`Firestore doc [${path}] error:`, err)
        );
      } catch(e) { console.error(e); }
    }
    if (window._dbReady) {
      subscribe();
    } else {
      document.addEventListener('firebase-ready', subscribe, { once: true });
    }
    return () => { if (unsub) unsub(); };
  }, [path]);

  const merge = useCallback((u) => {
    if (!window.db) return;
    return window.db.doc(path).set(u, { merge: true });
  }, [path]);

  return [data, merge];
}

  const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('ec_user_v1')));
  const [view, setView] = useState('home');
  const [activeSubject, setActiveSubject] = useState('all');
  const [editMode, setEditMode] = useState(false);
  const [showA11y, setShowA11y] = useState(false);
  const [showAddExam, setShowAddExam] = useState(false);
  const [showAddNotice, setShowAddNotice] = useState(false);
  const [showAddEvent, setShowAddEvent] = useState(false);
  const [showAddContact, setShowAddContact] = useState(false);
  const [editingExam, setEditingExam] = useState(null);
  const [editingEvent, setEditingEvent] = useState(null);
  const [search, setSearch] = useState('');
  const [isTranslating, setIsTranslating] = useState(false);
  const [showWorkloadDetails, setShowWorkloadDetails] = useState(false);
  const [tempAttachment, setTempAttachment] = useState(null);
  const fileInputRef = useRef(null);

  const [a11y, setA11y] = useState(() => JSON.parse(localStorage.getItem('ec_a11y')) || {
    grayscale: false, highContrast: false, readableFont: false, highlightLinks: false, fontSize: 100
  });

  useEffect(() => {
    localStorage.setItem('ec_a11y', JSON.stringify(a11y));
    document.body.classList.toggle('a11y-grayscale', a11y.grayscale);
    document.body.classList.toggle('a11y-high-contrast', a11y.highContrast);
    document.body.classList.toggle('a11y-readable-font', a11y.readableFont);
    document.body.classList.toggle('a11y-highlight-links', a11y.highlightLinks);
    document.documentElement.style.fontSize = `${a11y.fontSize}%`;
  }, [a11y]);

  // FIX #5: now returns fbError too
  const [exams, addExamFB, delExam, updExam, examsReady, examsFbError] = useFireCollection('exams');
  const [notices, addNoticeFB, delNotice, , noticesReady] = useFireCollection('notices');
  const [contacts, addContact, delContact, , contactsReady] = useFireCollection('contacts');
  const [events, addEventFB, delEvent, updEvent, eventsReady] = useFireCollection('events');
  const [schedule, mergeSchedule] = useFireDoc('meta/schedule', {});
  const [meta] = useFireDoc('meta/settings', { homeroomPhone: '0526176593' });

  const dbReady = examsReady && noticesReady && contactsReady && eventsReady;
  // FIX #12: Show banner if Firebase errored
  const hasDbError = examsFbError;

  const today = useMemo(() => { const d = new Date(); d.setHours(0,0,0,0); return d; }, []);

  const upcoming = useMemo(() =>
    exams.filter(e => new Date(e.date) >= today).sort((a,b) => new Date(a.date) - new Date(b.date)),
    [exams, today]
  );

  const filtered = useMemo(() =>
    activeSubject === 'all' ? upcoming : upcoming.filter(e => e.subject === activeSubject),
    [upcoming, activeSubject]
  );

  // הפרדה: הערכות (נספרות) לעומת פעילויות (לא נספרות)
  const filteredAssessments = useMemo(() => filtered.filter(e => ASSESSMENT_TYPES.has(e.type)), [filtered]);
  const filteredActivities  = useMemo(() => filtered.filter(e => ACTIVITY_TYPES.has(e.type)),   [filtered]);

  // FIX #4: useMemo for contacts filtering
  const filteredContacts = useMemo(() =>
    contacts.filter(c => c.studentName?.includes(search)),
    [contacts, search]
  );

  const workloadInfo = useMemo(() => {
    const weekFromNow = new Date(today); weekFromNow.setDate(today.getDate() + 7);
    // ✅ רק סוגים שנספרים בחוזר מנכ"ל
    const thisWeekAssessments = exams.filter(e => {
      const d = new Date(e.date);
      return ASSESSMENT_TYPES.has(e.type) && d >= today && d <= weekFromNow;
    });
    if (!thisWeekAssessments.length) return { status: 'safe', label: t.loadOk, sub: t.loadNoViolation, count: 0 };
    const dayCounts = {};
    thisWeekAssessments.forEach(e => { dayCounts[e.date] = (dayCounts[e.date] || 0) + 1; });
    const hasDailyViolation = Object.values(dayCounts).some(c => c > 1);
    const weeklyCount = thisWeekAssessments.length;
    if (hasDailyViolation || weeklyCount > 3) return { status: 'violation', label: t.loadViolation, sub: t.loadViolation, count: weeklyCount };
    if (weeklyCount === 3) return { status: 'warning', label: t.loadWarning, sub: t.loadWarning, count: weeklyCount };
    return { status: 'safe', label: t.loadOk, sub: t.loadNoViolation, count: weeklyCount };
  }, [exams, today, t]);

  const getUrgency = useCallback((date) => {
    const diff = Math.ceil((new Date(date) - today) / 86400000);
    if (diff < 0) return { c: null, t: t.urgency.past };
    if (diff === 0) return { c: 'urgent', t: t.urgency.today };
    if (diff === 1) return { c: 'urgent', t: t.urgency.tomorrow };
    if (diff <= 7) return { c: 'soon', t: t.urgency.days.replace('{n}', diff) };
    return { c: 'ok', t: t.urgency.days.replace('{n}', diff) };
  }, [today, t]);

  const getSubjectLabel = useCallback((s) => (lang === 'ru' && SUBJECT_MAP[s]) ? SUBJECT_MAP[s] : s, [lang]);

  const onFileSelect = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500 * 1024) { alert(t.fileTooLarge); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      setTempAttachment({ type: file.type.startsWith('image/') ? 'image' : 'file', data: ev.target.result, name: file.name });
      alert(t.fileAttached);
    };
    reader.readAsDataURL(file);
    e.target.value = '';  // reset so same file can be re-selected
  };

  // FIX #1: handleAddNotice now exists
  const handleAddNotice = async (text) => {
    if (!text.trim()) return;
    setIsTranslating(true);
    const translated = await autoTranslate(text, lang === 'he' ? 'ru' : 'he');
    await addNoticeFB({
      text_he: lang === 'he' ? text : translated,
      text_ru: lang === 'ru' ? text : translated,
      original: text
    });
    setShowAddNotice(false);
    setIsTranslating(false);
  };

  const handleSaveExam = async (item) => {
    setIsTranslating(true);
    const translated = await autoTranslate(item.details, lang === 'he' ? 'ru' : 'he');
    const data = {
      ...item,
      details_he: lang === 'he' ? item.details : translated,
      details_ru: lang === 'ru' ? item.details : translated,
      attachment: tempAttachment || item.attachment || null
    };
    if (editingExam) await updExam(editingExam.id, data);
    else await addExamFB(data);
    setEditingExam(null); setShowAddExam(false); setTempAttachment(null);
    setIsTranslating(false);
  };

  const handleSaveEvent = async (ev) => {
    setIsTranslating(true);
    const transTitle = await autoTranslate(ev.title, lang === 'he' ? 'ru' : 'he');
    const transDesc = await autoTranslate(ev.desc, lang === 'he' ? 'ru' : 'he');
    const data = {
      ...ev,
      title_he: lang === 'he' ? ev.title : transTitle,
      title_ru: lang === 'ru' ? ev.title : transTitle,
      desc_he: lang === 'he' ? ev.desc : transDesc,
      desc_ru: lang === 'ru' ? ev.desc : transDesc,
      attachment: tempAttachment || ev.attachment || null
    };
    if (editingEvent) await updEvent(editingEvent.id, data);
    else await addEventFB(data);
    setEditingEvent(null); setShowAddEvent(false); setTempAttachment(null);
    setIsTranslating(false);
  };

  const handleSaveContact = async (data) => {
    if (!data.studentName || !data.parent1Name || !data.parent1Phone) return;
    await addContact(data);
    setShowAddContact(false);
  };

  const renderAttachmentIcon = (item) => {
    const attach = item.attachment;
    if (!attach && !item.link) return null;
    if (item.link?.includes('drive.google.com')) return <Icon name="drive" size={14} color="var(--rosegold)" />;
    if (attach?.type === 'image') return <Icon name="image" size={14} color="var(--rosegold)" />;
    return <Icon name="file" size={14} color="var(--rosegold)" />;
  };

  const closeExamModal = () => { setShowAddExam(false); setEditingExam(null); setTempAttachment(null); };
  const closeEventModal = () => { setShowAddEvent(false); setEditingEvent(null); setTempAttachment(null); };

  if (!currentUser) return (
    <AuthScreen t={t} lang={lang} setLang={setLang}
      onLogin={u => { localStorage.setItem('ec_user_v1', JSON.stringify(u)); setCurrentUser(u); }} />
  );

  if (!dbReady) return (
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,color:'var(--indigo)',fontSize:18}}>
      📚 Easy Class...
    </div>
  );

  return (
    <div style={{minHeight:'100vh', paddingBottom:90}}>
      <input type="file" ref={fileInputRef} style={{display:'none'}} onChange={onFileSelect} accept="image/*,.pdf,.doc,.docx" />

      {/* FIX #12: Firebase error banner */}
      {hasDbError && <div className="db-error-banner">{t.dbError}</div>}

      {/* Accessibility FAB */}
      <button type="button" className="a11y-fab" onClick={() => setShowA11y(true)} aria-label={t.a11yTitle}>
        <Icon name="a11y" size={24} color="white" />
      </button>

      {/* HEADER */}
      <div className="header">
        <div className="header-inner">
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
            <div style={{display:'flex', alignItems:'center', gap:10}}>
              <div style={{width:38,height:38,background:'var(--indigo)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>📚</div>
              <div>
                <div style={{fontWeight:900,fontSize:18,color:'var(--indigo)'}}>{t.appName}</div>
                <div style={{fontSize:10,color:'var(--teal)',fontWeight:700}}>{t.classDesc}</div>
              </div>
            </div>
            <div style={{display:'flex', gap:6, alignItems:'center'}}>
              <button type="button" onClick={() => setLang(lang === 'he' ? 'ru' : 'he')}
                style={{background:'white',border:'1.5px solid var(--indigo-mid)',borderRadius:10,padding:'6px 10px',fontSize:12,fontWeight:900,color:'var(--indigo)',display:'flex',alignItems:'center',gap:4,boxShadow:'0 2px 5px rgba(0,0,0,0.05)',cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>
                <Icon name="globe" size={14} />{t.switchLang}
              </button>
              <button type="button" onClick={() => setEditMode(!editMode)}
                style={{background:editMode?'var(--indigo)':'var(--indigo-light)',color:editMode?'white':'var(--indigo)',border:'none',borderRadius:10,padding:'6px 10px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>
                {editMode ? t.close : 'Edit'}
              </button>
              <button type="button" onClick={() => { if(confirm(t.logout)) { localStorage.removeItem('ec_user_v1'); setCurrentUser(null); }}}
                style={{background:'#f1f5f9',border:'none',borderRadius:10,padding:'6px 10px',fontSize:12,fontWeight:700,color:'#64748b',cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>
                {currentUser.isDummy ? 'Tester' : currentUser.firstName}
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* SUBJECTS BAR */}
      <div style={{background:'white',borderBottom:'1px solid #e2e8f0',position:'sticky',top:64,zIndex:40,padding:'10px 16px'}}>
        <div className="subject-bar" style={{maxWidth:600, margin:'0 auto'}}>
          <button type="button" onClick={() => setActiveSubject('all')} className={`subject-pill ${activeSubject==='all'?'active':''}`}>{t.all}</button>
          {t.subjectsList.map((s, idx) => {
            const hebKey = TRANSLATIONS.he.subjectsList[idx];
            return (
              <button type="button" key={hebKey} onClick={() => { setActiveSubject(hebKey); setView('home'); }}
                className={`subject-pill ${activeSubject===hebKey?'active':''}`}>
                {s}
              </button>
            );
          })}
        </div>
      </div>

      {/* CONTENT */}
      <div style={{padding:16, maxWidth:600, margin:'0 auto'}}>

        {/* HOME TAB */}
        {view === 'home' && (
          <div className="fade-in">
            {/* Notices */}
            <div style={{marginBottom:20}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
                <div style={{fontWeight:900,fontSize:16}}>🔔 {t.noticesTitle}</div>
                {editMode && (
                  <button type="button" onClick={() => setShowAddNotice(true)}
                    style={{background:'var(--indigo)',border:'none',borderRadius:'50%',width:28,height:28,color:'white',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    +
                  </button>
                )}
              </div>
              {notices.length === 0 && <div style={{color:'#94a3b8',fontSize:13}}>{t.noNotices}</div>}
              {notices.slice(-3).reverse().map(n => (
                <div key={n.id} className="notice-card">
                  <div style={{fontSize:14,fontWeight:600}}>{n[`text_${lang}`] || n.original || n.text}</div>
                  {editMode && (
                    <button type="button" onClick={() => delNotice(n.id)} style={{fontSize:11,color:'var(--rose)',background:'none',border:'none',marginTop:6,cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>🗑️ מחק</button>
                  )}
                </div>
              ))}
            </div>

            {/* Workload Bar */}
            <div className={`workload-bar ${workloadInfo.status}`} onClick={() => setShowWorkloadDetails(!showWorkloadDetails)} role="button" tabIndex={0}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <Icon name="calendar" size={18} />
                <div>
                  <div>{workloadInfo.label}</div>
                  <div style={{fontSize:10,opacity:0.8,fontWeight:500}}>{workloadInfo.sub}</div>
                </div>
              </div>
              <div style={{fontSize:11}}>{t.clickForDetails}</div>
            </div>

            {showWorkloadDetails && (
              <div className="card zoom-in" style={{padding:14,marginBottom:20,border:'1.5px solid var(--indigo-mid)'}}>
                <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>{t.loadFooter}</div>
                <div style={{fontSize:11,color:'#64748b'}}>
                  {lang === 'he' ? '* המערכת מחשבת אוטומטית חריגות מבחנים לפי ימים ושבועות.' : '* Система автоматически рассчитывает превышение тестов по дням и неделям.'}
                </div>
              </div>
            )}

            {/* ══ SECTION 1: מבחנים ועבודות (נספרים בחוזר מנכ"ל) ══ */}
            <div style={{marginBottom:4}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div>
                  <div style={{fontWeight:900,fontSize:16}}>📝 {t.sectionAssessments}</div>
                  <div style={{fontSize:10,color:'var(--rose)',fontWeight:700,marginTop:2}}>⚖️ {t.sectionAssessmentsSub}</div>
                </div>
                <button type="button" onClick={() => setShowAddExam(true)}
                  style={{background:'var(--indigo)',border:'none',borderRadius:'50%',width:28,height:28,color:'white',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  +
                </button>
              </div>

              {filteredAssessments.length === 0
                ? <div style={{textAlign:'center',padding:'20px 0',color:'#94a3b8',fontSize:13}}>{t.noAssessments}</div>
                : filteredAssessments.map(ex => <ExamCard key={ex.id} ex={ex} t={t} lang={lang} editMode={editMode} getUrgency={getUrgency} getSubjectLabel={getSubjectLabel} renderAttachmentIcon={renderAttachmentIcon} onEdit={setEditingExam} onDelete={delExam} />)
              }
            </div>

            <div className="section-divider" />

            {/* ══ SECTION 2: משימות ופעילויות (לא נספרים) ══ */}
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div>
                  <div style={{fontWeight:900,fontSize:16}}>📋 {t.sectionActivities}</div>
                  <div style={{fontSize:10,color:'var(--teal)',fontWeight:700,marginTop:2}}>✓ {t.sectionActivitiesSub}</div>
                </div>
                {/* כפתור + זהה — פותח אותו modal, המשתמש בוחר סוג */}
                <button type="button" onClick={() => setShowAddExam(true)}
                  style={{background:'var(--teal)',border:'none',borderRadius:'50%',width:28,height:28,color:'white',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  +
                </button>
              </div>

              {filteredActivities.length === 0
                ? <div style={{textAlign:'center',padding:'20px 0',color:'#94a3b8',fontSize:13}}>{t.noActivities}</div>
                : filteredActivities.map(ex => <ExamCard key={ex.id} ex={ex} t={t} lang={lang} editMode={editMode} getUrgency={getUrgency} getSubjectLabel={getSubjectLabel} renderAttachmentIcon={renderAttachmentIcon} onEdit={setEditingExam} onDelete={delExam} />)
              }
            </div>
          </div>
        )}

        {/* SCHEDULE TAB */}
        {view === 'schedule' && (
          <div className="fade-in">
            <div style={{fontWeight:900,fontSize:18,marginBottom:16}}>🗓️ {t.scheduleTitle}</div>
            <div style={{overflowX:'auto'}} className="no-scroll">
              <div className="schedule-grid" style={{minWidth:480}}>
                <div className="hour-label">#</div>
                {t.days.map(d => <div key={d} className="schedule-header">{d}</div>)}
                {[1,2,3,4,5,6,7].map(h => (
                  <React.Fragment key={h}>
                    <div className="hour-label">{h}</div>
                    {TRANSLATIONS.he.days.map(d => {
                      const key = `${d}_${h}`;
                      const val = schedule[key] ?? PRESET_SCHEDULE[key] ?? '';
                      return (
                        <div key={key} className="schedule-cell">
                          {editMode
                            ? <input defaultValue={val} onBlur={e => mergeSchedule({[key]: e.target.value})} style={{width:'100%',border:'none',textAlign:'center',fontSize:9,fontFamily:'Rubik,sans-serif'}} />
                            : <span style={{fontSize:9}}>{val}</span>
                          }
                        </div>
                      );
                    })}
                  </React.Fragment>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* SOCIAL TAB */}
        {view === 'social' && (
          <div className="fade-in">
            <div style={{fontWeight:900,fontSize:18,marginBottom:16,display:'flex',justifyContent:'space-between'}}>
              <span>🎉 {t.eventsTitle}</span>
              {editMode && (
                <button type="button" onClick={() => setShowAddEvent(true)}
                  style={{background:'var(--indigo)',border:'none',borderRadius:'50%',width:28,height:28,color:'white',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  +
                </button>
              )}
            </div>
            {events.length === 0 && <div style={{textAlign:'center',padding:40,color:'#94a3b8'}}>אין אירועים קרובים</div>}
            {events.map(ev => (
              <div key={ev.id} className="exam-card">
                <div className="date-box"><div className="day">{new Date(ev.date).getDate()}</div></div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800}}>{ev[`title_${lang}`] || ev.title}</div>
                  <div style={{fontSize:12,color:'#64748b'}}>{ev[`desc_${lang}`] || ev.desc}</div>
                </div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  {renderAttachmentIcon(ev)}
                  {(ev.link || ev.attachment?.data) && (
                    <a href={ev.link || ev.attachment.data} target="_blank" rel="noreferrer" className="link-btn" title={t.openLink}>
                      <Icon name="link" size={14} />
                    </a>
                  )}
                  {editMode && (
                    <>
                      <button type="button" className="edit-btn" onClick={() => setEditingEvent(ev)}><Icon name="edit" size={16} /></button>
                      <button type="button" className="edit-btn" style={{color:'#EF4444'}} onClick={() => delEvent(ev.id)}><Icon name="trash" size={16} /></button>
                    </>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* CONTACTS TAB */}
        {view === 'contacts' && (
          <div className="fade-in">
            <div className="card" style={{padding:16,marginBottom:16,background:'var(--indigo-light)'}}>
              <div style={{fontSize:10,fontWeight:800,color:'var(--indigo)'}}>{t.homeroomLabel}</div>
              <div style={{fontWeight:900,fontSize:18}}>לילי / Лили</div>
              <a href={`tel:${meta.homeroomPhone}`} style={{color:'var(--indigo)',fontWeight:700,fontSize:14}}>📞 {meta.homeroomPhone}</a>
            </div>
            <div style={{display:'flex',gap:8,marginBottom:16}}>
              <input className="input-field" placeholder={t.searchStudent} value={search} onChange={e => setSearch(e.target.value)} style={{flex:1}} />
              <button type="button" onClick={() => setShowAddContact(true)}
                style={{background:'var(--indigo)',color:'white',border:'none',borderRadius:12,padding:'0 14px',fontWeight:700,cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>
                +
              </button>
            </div>
            <div className="card">
              {filteredContacts.length === 0 && <div style={{padding:20,color:'#94a3b8',textAlign:'center',fontSize:13}}>לא נמצאו תלמידים</div>}
              {filteredContacts.map(c => (
                <div key={c.id} className="contact-row">
                  <div className="contact-avatar">{c.studentName?.[0] || '?'}</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:800}}>{c.studentName}</div>
                    <div style={{fontSize:11,color:'#64748b'}}>{c.parent1Name} · {c.parent1Phone}</div>
                  </div>
                  {editMode && (
                    <button type="button" onClick={() => delContact(c.id)} style={{border:'none',background:'none',cursor:'pointer'}}>🗑️</button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* TAB BAR */}
      <div className="tab-bar" role="navigation">
        <div className="tab-bar-inner">
          <button type="button" onClick={() => setView('home')} className={`tab-btn ${view==='home'?'active':''}`}>
            <Icon name="home" /><span className="label">{t.homeTab}</span>
          </button>
          <button type="button" onClick={() => setView('schedule')} className={`tab-btn ${view==='schedule'?'active':''}`}>
            <Icon name="grid" /><span className="label">{t.scheduleTab}</span>
          </button>
          <button type="button" onClick={() => setView('social')} className={`tab-btn ${view==='social'?'active':''}`}>
            <Icon name="social" /><span className="label">{t.socialTab}</span>
          </button>
          <button type="button" onClick={() => setView('contacts')} className={`tab-btn ${view==='contacts'?'active':''}`}>
            <Icon name="users" /><span className="label">{t.contactsTab}</span>
          </button>
        </div>
      </div>

      {/* MODALS */}
      {showAddNotice && (
        <NoticeModal t={t} onClose={() => setShowAddNotice(false)} onSave={handleAddNotice} isTranslating={isTranslating} />
      )}

      {(showAddExam || editingExam) && (
        <ExamModal t={t} lang={lang} editingExam={editingExam} onClose={closeExamModal} onSave={handleSaveExam}
          isTranslating={isTranslating} fileInputRef={fileInputRef} tempAttachment={tempAttachment} setTempAttachment={setTempAttachment} />
      )}

      {(showAddEvent || editingEvent) && (
        <EventModal t={t} lang={lang} editingEvent={editingEvent} onClose={closeEventModal} onSave={handleSaveEvent}
          isTranslating={isTranslating} fileInputRef={fileInputRef} tempAttachment={tempAttachment} setTempAttachment={setTempAttachment} />
      )}

      {showAddContact && (
        <ContactModal t={t} onClose={() => setShowAddContact(false)} onSave={handleSaveContact} />
      )}

      {/* ACCESSIBILITY MODAL */}
      {showA11y && (
        <div className="modal-overlay" onClick={() => setShowA11y(false)}>
          <div className="modal-sheet" onClick={e => e.stopPropagation()}>
            <div className="modal-handle" />
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div style={{fontWeight:900,fontSize:18}}>{t.a11yTitle}</div>
              <div style={{display:'flex',gap:8}}>
                <button type="button" onClick={() => setLang('he')} style={{fontWeight:lang==='he'?900:400,color:lang==='he'?'var(--indigo)':'#94a3b8',border:'none',background:'none',cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>HE</button>
                <button type="button" onClick={() => setLang('ru')} style={{fontWeight:lang==='ru'?900:400,color:lang==='ru'?'var(--indigo)':'#94a3b8',border:'none',background:'none',cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>RU</button>
              </div>
            </div>
            <div className="a11y-grid">
              <button type="button" className={`a11y-option ${a11y.highContrast?'active':''}`} onClick={() => setA11y(p => ({...p,highContrast:!p.highContrast}))}>🌓 {t.a11yContrast}</button>
              <button type="button" className={`a11y-option ${a11y.grayscale?'active':''}`} onClick={() => setA11y(p => ({...p,grayscale:!p.grayscale}))}>🏁 {t.a11yGrayscale}</button>
              <button type="button" className={`a11y-option ${a11y.readableFont?'active':''}`} onClick={() => setA11y(p => ({...p,readableFont:!p.readableFont}))}>🔤 {t.a11yFont}</button>
              <button type="button" className={`a11y-option ${a11y.highlightLinks?'active':''}`} onClick={() => setA11y(p => ({...p,highlightLinks:!p.highlightLinks}))}>🔗 {t.a11yLinks}</button>
            </div>
            <button type="button" className="btn-primary" onClick={() => setShowA11y(false)} style={{marginTop:20}}>{t.close}</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── AUTH SCREEN ──────────────────────────────────────────────────────────────

function AuthScreen({ t, lang, setLang, onLogin }) {
  const [step, setStep] = useState('code');
  const [code, setCode] = useState('');
  const [role, setRole] = useState('');
  const [f, setF] = useState({ firstName:'', lastName:'', phone:'' });

  const handleSubmit = () => {
    if (f.phone === '123123') {
      onLogin({ id:'dummy-tester-id-'+Date.now(), firstName:'Tester', lastName:'Mode', phone:'123123', role:'admin', isDummy:true });
      return;
    }
    if (role && f.firstName && f.lastName && f.phone) onLogin({...f, role});
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#EEF2FF 0%,#CCFBF1 100%)',padding:20}}>
      <div style={{position:'absolute',top:20,right:20,display:'flex',gap:10}}>
        <button type="button" onClick={() => setLang('he')} style={{fontWeight:lang==='he'?900:400,border:'none',background:'none',fontSize:12,cursor:'pointer'}}>HE</button>
        <button type="button" onClick={() => setLang('ru')} style={{fontWeight:lang==='ru'?900:400,border:'none',background:'none',fontSize:12,cursor:'pointer'}}>RU</button>
      </div>
      <div style={{background:'white',borderRadius:28,padding:28,width:'100%',maxWidth:420,boxShadow:'0 20px 60px rgba(0,0,0,0.1)'}}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:48}}>📚</div>
          <div style={{fontWeight:900,fontSize:24,color:'var(--indigo)'}}>{t.appName}</div>
        </div>
        {step === 'code' ? (
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div style={{fontSize:14,fontWeight:700,textAlign:'center'}}>{t.classCodeLabel}</div>
            <input className="input-field" type="password" value={code} onChange={e => setCode(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && (code==='1111' ? setStep('details') : alert(t.classCodeWrong))}
              style={{textAlign:'center',fontSize:24,letterSpacing:8}} />
            <button type="button" className="btn-primary" onClick={() => code==='1111' ? setStep('details') : alert(t.classCodeWrong)}>{t.continue}</button>
          </div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{display:'flex',gap:8}}>
              <input className="input-field" placeholder={t.firstName} value={f.firstName} onChange={e => setF({...f,firstName:e.target.value})} />
              <input className="input-field" placeholder={t.lastName} value={f.lastName} onChange={e => setF({...f,lastName:e.target.value})} />
            </div>
            <input className="input-field" placeholder={t.phone} value={f.phone} onChange={e => setF({...f,phone:e.target.value})} />
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button type="button" onClick={() => setRole('parent')}
                style={{flex:1,padding:10,borderRadius:12,border:role==='parent'?'2px solid var(--indigo)':'1px solid #ddd',background:role==='parent'?'var(--indigo-light)':'white',cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>
                {t.parent}
              </button>
              <button type="button" onClick={() => setRole('student')}
                style={{flex:1,padding:10,borderRadius:12,border:role==='student'?'2px solid var(--indigo)':'1px solid #ddd',background:role==='student'?'var(--indigo-light)':'white',cursor:'pointer',fontFamily:'Rubik,sans-serif'}}>
                {t.student}
              </button>
            </div>
            <button type="button" className="btn-primary" onClick={handleSubmit}
              disabled={f.phone !== '123123' && (!role || !f.firstName || !f.lastName || !f.phone)}>
              {t.enterApp}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
